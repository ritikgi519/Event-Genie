    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Polyfill/enable writable setter on window.fetch for browser extensions and test interceptors
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = function() {
            return _origFetch.apply(window, arguments);
          };
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            }
          });
        } catch (e) {
          // If defineProperty is restricted, safely ignore
        }

        // Suppress uncaught errors leaking from chrome-extension scripts
        window.addEventListener('error', function(event) {
          if (event && (
            (event.filename && event.filename.indexOf('chrome-extension:') !== -1) ||
            (event.message && event.message.indexOf('chrome-extension') !== -1) ||
            (event.message && event.message.indexOf('which has only a getter') !== -1)
          )) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
